version: 2

updates:
  # Bump vendor/feedvalidator to track upstream w3c/feedvalidator main.
  # `fix:` prefix so Release Please treats each bump as a patch release.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope

  # Keep our own workflow action pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # Bump the pins in requirements.txt. Dependabot re-runs pip-compile with
  # hashes, and the regenerate-lockfile job runs on its PRs as a check.
  # `fix:` so runtime dependency bumps ship as patch releases.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
