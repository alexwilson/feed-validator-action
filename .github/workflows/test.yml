name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regenerate-lockfile:
    name: Regenerate lockfile (Dependabot submodule bumps)
    # Actor check + same-repo check belts-and-braces against fork PRs ever
    # reaching the write-permission code path.
    if: >-
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Regenerate lockfile
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          pip install -q pip-tools
          pip-compile --generate-hashes --quiet --output-file requirements.txt requirements.in
          if [ -n "$(git status --porcelain requirements.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add requirements.txt
            git commit -m "chore: regenerate lockfile for submodule bump"
            git push
          fi

  test:
    name: Run contract tests
    needs: [regenerate-lockfile]
    # `always()` so tests still run when regen is skipped (non-Dependabot PRs,
    # pushes to main) or when regen fails (loud failure is what we want).
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # For PRs, check out the head branch by name so the checkout picks
          # up any commit the regenerate-lockfile job just pushed.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: pip install -q --require-hashes -r requirements.txt
      - name: Run tests
        run: pytest tests/

  smoke:
    name: Run the action against a fixture
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      # Exercises action.yml itself (setup-python expression, pip install,
      # entrypoint wiring), which the pytest job does not touch.
      - uses: ./
        with:
          feed: tests/fixtures/valid.atom
          origin-url: http://example.org/feed.atom
          fail-on: warnings
